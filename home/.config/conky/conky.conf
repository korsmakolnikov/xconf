-- Antracite system monitor, drawn on the desktop under the windows (top right).
-- Detail the eww bar has no room for: GPU and what runs on it (local models),
-- CPU, memory, disk and network history, top processes, containers, agents.
-- conky.conf is Lua: the network interface, the root disk and the NVIDIA GPU are
-- detected when conky loads it, so the same file works on every machine.
-- conky reloads this file when it changes.

local function sh(cmd)
  local p = io.popen(cmd)
  local out = p:read("*a") or ""
  p:close()
  return (out:gsub("%s+$", ""))
end

local iface = sh("ip route show default | awk '{print $5; exit}'")
local disk = sh("lsblk -no PKNAME \"$(findmnt -no SOURCE / | sed 's/\\[.*//')\"")
local nvidia = io.open("/proc/driver/nvidia/version") ~= nil
local cpu = sh("awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo"):gsub("%s+%d+%-Core Processor", "")
local scripts = os.getenv("HOME") .. "/.config/conky/scripts"

conky.config = {
  -- window: below everything, on every workspace
  own_window = true,
  own_window_type = 'override',
  own_window_class = 'Conky',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_color = '#D91B1F21', -- bg0 at 85%: conky gives this alpha to bars and rules too
  -- picom rounds the window; background.lua draws the border
  lua_load = os.getenv("HOME") .. '/.config/conky/background.lua',
  lua_draw_hook_pre = 'background',
  alignment = 'top_right',
  -- 10px from the screen edges like rofi and dunst: the gaps place the text, the margin grows outwards
  gap_x = 30,
  gap_y = 30,
  minimum_width = 440,
  maximum_width = 440,
  border_inner_margin = 18,
  double_buffer = true,

  update_interval = 2,
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  top_name_width = 22,
  short_units = true,
  if_up_strictness = 'address',

  use_xft = true,
  font = 'JetBrainsMono Nerd Font:size=10',
  draw_shades = false,
  draw_outline = false,
  draw_borders = false,
  draw_graph_borders = false,
  default_bar_width = 0,
  default_bar_height = 6,
  default_graph_height = 32,

  -- Antracite palette (home/.config/eww/eww.scss)
  default_color = 'd6dadb', -- fg
  color1 = '8a9498',        -- fg-dim, labels
  color2 = 'e05bbf',        -- fuchsia, headers and bars
  color3 = '8ea5b2',        -- steel, second series
  color4 = '9bb07f',        -- green
  color5 = 'd8b568',        -- yellow
  color6 = 'e0566e',        -- red
  color7 = '383e42',        -- bg3, rules

  -- ${template0 icon title}: section header with a rule
  template0 = [[${color2}\1 ${font JetBrainsMono Nerd Font:bold:size=10}\2${font}${color7} ${hr 1}${color}]],
}

local text = [[
${color2}${font JetBrainsMono Nerd Font:bold:size=12}${nodename}${font}${color1}${alignr}${kernel}
${color1}uptime ${color}${uptime_short}${alignr}${color1}load ${color}${loadavg}
]]

if nvidia then
  text = text .. [[

${template0 󰢮 GPU}
${color}${nvidia modelname}${alignr}${color1}${nvidia gpufreqcur} MHz
${color1}util ${color}${nvidia gpuutil}%${goto 120}${color2}${nvidiabar gpuutil}
${color2}${nvidiagraph gpuutil 32,0}
${color1}vram ${color}${nvidia memused} / ${nvidia memmax} MiB${alignr}${nvidia memperc}%
${color3}${nvidiabar memperc}
${color1}temp ${color}${nvidia temp}°C${goto 150}${color1}fan ${color}${nvidia fanlevel}%${goto 260}${execpi 4 ]] .. scripts .. [[/gpu.sh power}
${execpi 4 ]] .. scripts .. [[/gpu.sh procs}
${execpi 10 ]] .. scripts .. [[/gpu.sh ollama}]]
end

text = text .. [[


${template0 󰻠 CPU}
${color}]] .. cpu .. [[${alignr}${color1}${freq_g} GHz
${color1}use ${color}${cpu}%${goto 120}${color2}${cpubar}
${color2}${cpugraph 32,0}
${color1}temp ${color}${hwmon k10temp temp 1}°C${goto 150}${color1}procs ${color}${processes}${goto 260}${color1}running ${color}${running_processes}

${template0 󰍛 MEMORY}
${color1}ram  ${color}${mem} / ${memmax}${alignr}${memperc}%
${color2}${membar}
${color1}swap ${color}${swap} / ${swapmax}${alignr}${swapperc}%
${color3}${swapbar}

${template0 󰄨 TOP}
${color1}cpu${goto 230}cpu%${goto 300}mem%${alignr}mem
${color}${top name 1}${goto 230}${top cpu 1}${goto 300}${top mem 1}${alignr}${top mem_res 1}
${color}${top name 2}${goto 230}${top cpu 2}${goto 300}${top mem 2}${alignr}${top mem_res 2}
${color}${top name 3}${goto 230}${top cpu 3}${goto 300}${top mem 3}${alignr}${top mem_res 3}
${color1}memory
${color}${top_mem name 1}${goto 230}${top_mem cpu 1}${goto 300}${top_mem mem 1}${alignr}${top_mem mem_res 1}
${color}${top_mem name 2}${goto 230}${top_mem cpu 2}${goto 300}${top_mem mem 2}${alignr}${top_mem mem_res 2}
${color}${top_mem name 3}${goto 230}${top_mem cpu 3}${goto 300}${top_mem mem 3}${alignr}${top_mem mem_res 3}
]]

if disk ~= "" then
  text = text .. [[

${template0 󰋊 DISK}
${color1}/ ${color}${fs_used /} / ${fs_size /}${alignr}${color1}]] .. disk .. [[

${color2}${fs_bar /}
${color1}read ${color}${diskio_read /dev/]] .. disk .. [[}${goto 220}${color1}write ${color}${diskio_write /dev/]] .. disk .. [[}
${color2}${diskiograph_read /dev/]] .. disk .. [[ 24,210}${alignr}${color3}${diskiograph_write /dev/]] .. disk .. [[ 24,210}
]]
end

if iface ~= "" then
  text = text .. [[

${template0 󰛳 NETWORK}
${color1}]] .. iface .. [[ ${color}${addr ]] .. iface .. [[}${alignr}${color1}total ↓${color}${totaldown ]] .. iface .. [[}${color1} ↑${color}${totalup ]] .. iface .. [[}
${color1}down ${color}${downspeed ]] .. iface .. [[}${goto 220}${color1}up ${color}${upspeed ]] .. iface .. [[}
${color2}${downspeedgraph ]] .. iface .. [[ 24,210}${alignr}${color3}${upspeedgraph ]] .. iface .. [[ 24,210}
]]
end

text = text .. [[

${template0 󰡨 CONTAINERS}
${execpi 10 ]] .. scripts .. [[/containers.sh}

${template0 󰚩 AGENTS}
${execpi 10 ]] .. scripts .. [[/agents.sh}]]

conky.text = text
